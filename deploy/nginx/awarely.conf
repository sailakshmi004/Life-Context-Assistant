# Awarely — Nginx site configuration
#
# Copy to /etc/nginx/sites-available/awarely, change server_name, enable it,
# then run certbot for TLS:
#   sudo certbot --nginx -d awarely.example.com
#
# PM2 should listen on 127.0.0.1:3000.

server {
    listen 80;
    listen [::]:80;
    server_name awarely.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js/websocket compatibility
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
